name: Build (reusable)

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      llvm_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          runner: ${{ inputs.runner }}
          llvm_version: ${{ inputs.llvm_version }}

      - name: Configure build
        run: |
          cmake -S . -B build_ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: |
          cmake --build build_ninja --target udp_streaming_lib --parallel
          cmake --build build_ninja --target udp_streamer --parallel
          cmake --build build_ninja --target tests --parallel || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build_ninja-${{ inputs.runner }}
          path: build_ninja
