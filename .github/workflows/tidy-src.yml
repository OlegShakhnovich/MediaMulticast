name: Tidy-src (reusable)

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      llvm_version:
        required: true
        type: string

jobs:
  tidy-src:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM ${{ inputs.llvm_version }}
        uses: ./.github/actions/setup-llvm
        with:
          runner: ${{ inputs.runner }}
          llvm_version: ${{ inputs.llvm_version }}

      - name: Debug LLVM path on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |

      - uses: actions/cache@v4
        with:
          path: build_tidy
          key: ${{ inputs.runner }}-tidy-src-${{ hashFiles('./src/**/*.cpp', './src/**/*.cc', './src/**/*.h', './src/**/*.hpp', './include/**/*.h', './include/**/*.hpp') }}

      - name: Generate compile_commands.json (MacOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
          cmake -G Ninja -S . -B build_tidy \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OSX_SYSROOT="$SYSROOT"

      - name: Generate compile_commands.json (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -G Ninja -S . -B build_tidy \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Generate compile_commands.json (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -G Ninja -S . -B build_tidy `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ 

      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v4
        with:
          name: compile_commands-src-${{ inputs.runner }}
          path: build_tidy/compile_commands.json

      - name: Verify compiler selection (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang --version
          clang++ --version
          cmake -B test_build -S . -N -DCMAKE_C_COMPILER="clang" -DCMAKE_CXX_COMPILER="clang++"

      - name: Run unified clang-tidy
        uses: ./.github/actions/run-tidy
        with:
          build_dir: build_tidy
          config_path: .clang-tidy
