name: Tidy-src (reusable)

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      llvm_version:
        required: true
        type: string

jobs:
  tidy-src:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v4
  
      - name: Setup LLVM ${{ inputs.llvm_version }}
        uses: ./.github/actions/setup-llvm
        with:
          runner: ${{ inputs.runner }}
          llvm_version: ${{ inputs.llvm_version }}


      - name: Generate compile_commands.json (MacOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
          cmake -G Ninja -S . -B build_tidy \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_TARGET=arm64-apple-macosx15.0 \
          -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-macosx15.0 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
          -DCMAKE_OSX_SYSROOT="$SYSROOT"
          
      - name: Generate compile_commands.json (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -G Ninja -S . -B build_tidy \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
      
      - name: Generate compile_commands.json (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -G Ninja -S . -B build_tidy `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ 


      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v4
        with:
          name: compile_commands-src-${{ inputs.runner }}
          path: build_tidy/compile_commands.json


      - name: Verify compiler selection (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Checking actual compiler ==="
          Write-Host "Clang version:"
          clang --version
          Write-Host "Clang++ version:"
          clang++ --version
          Write-Host "CMake C compiler:"
          cmake -B test_build -S . -N -DCMAKE_C_COMPILER="clang" -DCMAKE_CXX_COMPILER="clang++"
          Write-Host "=== CMake completed successfully ==="


      - name: Run clang-tidy on src/include (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          any_error=false
          find src include -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.h' -o -name '*.hpp' \) | while IFS= read -r f; do
            echo "Checking: $f"
            if clang-tidy -config-file=.clang-tidy -p build_tidy "$f"; then
              echo "No issues found in: $f"
            else
              echo "clang-tidy found issues in: $f"
              any_error=true
            fi
          done

          if [ "$any_error" = true ]; then
            echo "clang-tidy found issues in one or more files. Job failed."
            exit 1
          else
            echo "clang-tidy completed successfully - no issues found in any files."
          fi
       
      - name: Run clang-tidy on src/include (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |    
          $config = Join-Path $PWD ".clang-tidy"    
          $files = Get-ChildItem -Recurse src,include -Include *.cpp,*.cc,*.h,*.hpp
          $anyError = $false
    
          foreach ($f in $files) {
            Write-Host "Checking: $($f.FullName)"
            & clang-tidy -config-file "$config" -p build_tidy $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "clang-tidy found issues in: $($f.FullName)" -ForegroundColor Red
              $anyError = $true
            } else {
              Write-Host "No issues found in: $($f.FullName)"
            }
          }
    
          if ($anyError) {
            Write-Error "clang-tidy found issues in one or more files. Job failed."
            exit 1
          } else {
            Write-Host "clang-tidy completed successfully - no issues found in any files."
          }
