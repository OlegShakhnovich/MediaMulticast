name: Install LLVM (reusable)

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      llvm_version:
        required: true
        type: string

jobs:
  install:
    runs-on: ${{ inputs.runner }}
    outputs:
      llvm-bin-path: ${{ steps.set-outputs.outputs.llvm_bin_path }}

    steps:

      - name: Cache LLVM archives
        id: cache-llvm-archives
        uses: actions/cache@v3
        with:
          path: |
            llvm-archive-*
          key: ${{ inputs.runner }}-llvm-archive-${{ inputs.llvm_version }}
          restore-keys: |
            ${{ inputs.runner }}-llvm-archive-

      - name: Download LLVM archive for Linux
        if: ${{ inputs.runner == 'ubuntu-latest' && steps.cache-llvm-archives.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils
          wget -O llvm-archive-linux.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm_version }}/LLVM-${{ inputs.llvm_version }}-Linux-X64.tar.xz
  
    
      - name: Download LLVM archive for macOS
        if: ${{ inputs.runner == 'macos-latest' && steps.cache-llvm-archives.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          wget -O llvm-archive-macos.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm_version }}/LLVM-${{ inputs.llvm_version }}-macOS-ARM64.tar.xz

      - name: Download LLVM archive for Windows
        if: ${{ inputs.runner == 'windows-latest' && steps.cache-llvm-archives.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm_version }}/clang+llvm-${{ inputs.llvm_version }}-x86_64-pc-windows-msvc.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile llvm-archive-windows.tar.xz


      - name: Extract LLVM on Linux
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        shell: bash
        run: |
          tar -xf llvm-archive-linux.tar.xz
          mv LLVM-${{ inputs.llvm_version }}-Linux-X64 llvm
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Extract LLVM on macOS
        if: ${{ inputs.runner == 'macos-latest' }}
        shell: bash
        run: |
          tar -xf llvm-archive-macos.tar.xz
          mv LLVM-${{ inputs.llvm_version }}-macOS-ARM64 llvm
          echo "$PWD/llvm/bin" >> $GITHUB_PATH

      - name: Extract LLVM on Windows
        if: ${{ inputs.runner == 'windows-latest' }}
        shell: pwsh
        run: |
          $dest = "C:\LLVM"
          if (-Not (Test-Path $dest)) {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
          }
          tar -xf llvm-archive-windows.tar.xz -C $dest --strip-components=1
          echo "$dest/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8


      - name: Verify installation
        run: |
          echo "=== Checking clang version ==="
          clang --version || echo "clang not found"
          echo "=== Checking clang-tidy version ==="
          clang-tidy --version || echo "clang-tidy not found"
          echo "=== Checking clang-format version ==="
          clang-format --version || echo "clang-format not found"
          echo "=== Cache status ==="
          echo "Archive cache hit: ${{ steps.cache-llvm-archives.outputs.cache-hit }}"
          
      - name: Export final LLVM path on Linux
        id: export-path-linux
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        shell: bash
        run: |
          echo "llvm_path=$PWD/llvm/bin" >> $GITHUB_OUTPUT
          
      - name: Export final LLVM path on macOS
        id: export-path-macos
        if: ${{ inputs.runner == 'macos-latest' }}
        shell: bash
        run: |
          echo "llvm_path=$PWD/llvm/bin" >> $GITHUB_OUTPUT    
          
      - name: Export final LLVM path on Windows
        id: export-path-windows
        if: ${{ inputs.runner == 'windows-latest' }}
        shell: pwsh
        run: |
          echo "llvm_path=C:\LLVM\bin" >> $GITHUB_OUTPUT

      - name: Debug LLVM path output on Linux/macOS
        if: ${{ inputs.runner != 'windows-latest' }}
        shell: bash
        run: |
          echo "LLVM bin path that will be exported:"
          echo "$PWD/llvm/bin"

      - name: Debug LLVM path output on Windows
        if: ${{ inputs.runner == 'windows-latest' }}
        shell: pwsh
        run: |
          echo "LLVM bin path that will be exported:"
          echo "C:\LLVM\bin"

      - name: Debug LLVM path output
        shell: bash
        run: |
          echo "llvm_path from outputs: ${{ steps.set-outputs-linux.outputs.llvm_bin_path || steps.set-outputs-macos.outputs.llvm_bin_path || steps.set-outputs-windows.outputs.llvm_bin_path }}"

          