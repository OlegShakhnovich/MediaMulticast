name: C++ CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang tools (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y clang clang-format clang-tidy
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install llvm
            echo "BREW_LLVM_BIN=$(brew --prefix llvm)/bin" >> $GITHUB_ENV
            sudo xcode-select -switch /Applications/Xcode.app || true
          fi
          
      - name: Check LLVM version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $minVersion = [Version]"18.1.8"
          $clangVersionStr = & clang --version 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($clangVersionStr)) {
              Write-Host "clang not found or produced no output. Installing LLVM via choco..."
              choco install llvm -y
          } else {
              $pattern = '(?i)(?:clang|llvm)(?:\.exe)?\s*(?:version)?\s*([\d]+(?:\.[\d]+){1,3})'
              $m = [regex]::Match($clangVersionStr, $pattern)

              if ($m.Success -and -not [string]::IsNullOrWhiteSpace($m.Groups[1].Value)) {
                  $verStr = $m.Groups[1].Value
                  try {
                      $currentVersion = [Version]$verStr
                      if ($currentVersion -lt $minVersion) {
                          Write-Host "Current LLVM version $currentVersion is older than $minVersion. Upgrading..."
                          choco upgrade llvm -y
                      } else {
                          Write-Host "LLVM version $currentVersion is sufficient. Skipping install."
                      }
                  } catch {
                      Write-Host "Parsed version '$verStr' but failed to convert to System.Version. Installing/Upgrading LLVM as fallback..."
                      choco install llvm -y
                  }
              } else {
                  Write-Host "Could not parse clang/LLVM version output. Installing/Upgrading LLVM as fallback..."
                  choco install llvm -y
              }
          }
          
      - name: Add LLVM to PATH
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Check formatting with clang-format (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Running clang-format check..."
          if command -v clang-format >/dev/null 2>&1; then
            CF=clang-format
          elif [[ -n "${BREW_LLVM_BIN:-}" && -x "${BREW_LLVM_BIN}/clang-format" ]]; then
            CF="${BREW_LLVM_BIN}/clang-format"
          else
            if command -v brew >/dev/null 2>&1; then
              brew install llvm
              export BREW_LLVM_BIN="$(brew --prefix llvm)/bin"
              CF="${BREW_LLVM_BIN}/clang-format"
            else
              echo "clang-format not found and brew unavailable. Failing."
              exit 1
            fi
          fi

          mapfile -t files < <(find src include -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.cc' \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No source files found."
            exit 0
          fi
          
          echo "Using clang-format at: $CF"
          rc=0
          for f in "${files[@]}"; do
            "$CF" --dry-run --Werror "$f" || rc=1
          done
          exit $rc

      - name: Check formatting with clang-format (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Running clang-format check..."
          $files = Get-ChildItem -Recurse -Include *.cpp,*.hpp,*.h,*.cc src,include
          foreach ($f in $files) {
              clang-format --dry-run --Werror $f.FullName
          }
      - name: Run clang-tidy analysis (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Running clang-tidy..."
          cmake -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -S . -B build_ninja
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)
          if [[ -n "$SDK_PATH" ]]; then
            echo "Using macOS SDK: $SDK_PATH"
            find src include -name '*.cpp' -print0 | xargs -0 -n1 clang-tidy -p build_ninja -- -isysroot "$SDK_PATH" || true
          else
            find src include -name '*.cpp' -print0 | xargs -0 -n1 clang-tidy -p build_ninja || true
          fi

      - name: Run clang-tidy analysis (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Running clang-tidy..."
          cmake -G "Ninja" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -S . -B build_ninja
          $files = Get-ChildItem -Recurse -Include *.cpp src,include
          foreach ($f in $files) {
              clang-tidy -p build_ninja $f.FullName
          }

      - name: Show environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "OS information:"
          uname -a
          echo "CMake version:"
          cmake --version
          echo "Compiler version:"
          g++ --version || clang++ --version
          echo "PATH:"
          echo "$PATH"

      - name: Show environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "OS information:"
          systeminfo

          Write-Host "CMake version:"
          cmake --version

          Write-Host "Compiler version (try cl):"
          if (Get-Command cl -ErrorAction SilentlyContinue) {
            cl
          } else {
            Write-Host "cl not found in PATH"
            $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              $inst = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -products * -property installationPath
              if ($inst) {
                Write-Host "Found VS at: $inst. Sourcing vcvarsall.bat x64..."
                & "$inst\VC\Auxiliary\Build\vcvarsall.bat" x64
                if (Get-Command cl -ErrorAction SilentlyContinue) { cl } else { Write-Host "cl still not found after vcvarsall" }
              } else {
                Write-Host "vswhere did not locate a VS installation with VC tools."
              }
            } else {
              Write-Host "vswhere not found at expected path: $vswhere"
            }
          }
          
          Write-Host "PATH:"
          Write-Host $env:PATH

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y ccache
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install ccache
          fi
   
      - name: Configure build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_INSTALL_PREFIX=$PWD/install
            else
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_INSTALL_PREFIX=$PWD/install
            fi
          else
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
                -DCMAKE_INSTALL_PREFIX=$PWD/install
            else
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_INSTALL_PREFIX=$PWD/install
            fi
          fi

      - name: Configure build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ensure MSVC environment is initialized for this PowerShell session
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $inst = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -products * -property installationPath
            if ($inst) {
              & "$inst\VC\Auxiliary\Build\vcvarsall.bat" x64
            } else {
              Write-Host "vswhere found, but no VC tools installation matched."
            }
          } else {
            Write-Host "vswhere not found; attempting to proceed (CMake may still detect compiler)."
          }

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 -DCMAKE_INSTALL_PREFIX=$PWD\install
          
      - name: Build library (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --target udp_streaming_lib --config Release --parallel

      - name: Build library (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --target udp_streaming_lib --config Release --parallel

      - name: Build executable (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --target udp_streamer --config Release --parallel

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --target udp_streamer --config Release --parallel


      - name: Test
        run: |
          cd build
          ctest --output-on-failure --parallel || true

      - name: Install project
        run: cmake --install build --config Release

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: build
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-test-results
          path: build/Testing
