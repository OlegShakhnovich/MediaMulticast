name: C++ CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "OS information:"
          uname -a || systeminfo
          echo "CMake version:"
          cmake --version
          echo "Compiler version:"
          g++ --version || clang++ --version || cl
          echo "PATH:"
          echo $PATH

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y ccache
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install ccache
          fi

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache --no-progress || echo "ccache not available via Chocolatey"  
          
      - name: Configure build
        run: |
          if command -v ccache >/dev/null 2>&1; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
          fi

      - name: Build library (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --target udp_streaming_lib --config Release --parallel -- -Werror

      - name: Build library (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --target udp_streaming_lib --config Release --parallel -- /WX

      - name: Build executable (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --target udp_streamer --config Release --parallel -- -Werror

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --target udp_streamer --config Release --parallel -- /WX


      - name: Test
        run: |
          cd build
          ctest --output-on-failure --parallel || true

      - name: Install project
        run: cmake --install build --config Release

      - name: Show CMake configuration
        run: cmake --build build --target help

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: build
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-test-results
          path: build/Testing
