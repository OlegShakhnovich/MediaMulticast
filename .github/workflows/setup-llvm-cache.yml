name: Setup LLVM Cache (reusable)

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: 'The runner OS (ubuntu-latest, macos-latest, windows-latest)'
      llvm_version:
        required: true
        type: string
        description: 'The LLVM version to install and verify'

jobs:
  setup-llvm-cache:
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Cache LLVM
        uses: ./.github/actions/cache-llvm
        id: cache-llvm
        with:
          runner: ${{ inputs.runner }}
          llvm_version: ${{ inputs.llvm_version }}
          lookup-only: 'true'
          fail-on-cache-miss: 'false'


      - name: Download and extract LLVM on Linux
        if: ${{ inputs.runner == 'ubuntu-latest' && steps.cache-llvm.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm_version }}/LLVM-${{ inputs.llvm_version }}-Linux-X64.tar.xz
          DEST="~/tools/llvm-${{ inputs.llvm_version }}"
          mkdir -p "$DEST"
          tar -xf LLVM-${{ inputs.llvm_version }}-Linux-X64.tar.xz -C "$DEST" --strip-components=1

      - name: Download and extract LLVM on macOS
        if: ${{ inputs.runner == 'macos-latest' && steps.cache-llvm.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm_version }}/LLVM-${{ inputs.llvm_version }}-macOS-ARM64.tar.xz
          DEST="~/tools/llvm-${{ inputs.llvm_version }}"
          mkdir -p "$DEST"
          tar -xf LLVM-${{ inputs.llvm_version }}-macOS-ARM64.tar.xz -C "$DEST" --strip-components=1
          
      - name: Download and extract LLVM on Windows
        if: ${{ inputs.runner == 'windows-latest' && steps.cache-llvm.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm_version }}/clang+llvm-${{ inputs.llvm_version }}-x86_64-pc-windows-msvc.tar.xz"
          $archive = "llvm.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $dest = "%USERPROFILE%\tools\LLVM"
          if (-Not (Test-Path $dest)) {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
          }
          tar -xf $archive -C $dest --strip-components=1

      - name: Cache LLVM directory (Linux/macOS)
        if: ${{ inputs.runner != 'windows-latest' }}
        id: cache-llvm-unix
        uses: actions/cache@v4
        with:
          path: $HOME/llvm-${{ inputs.llvm_version }}
          key: global-llvm-${{ inputs.llvm_version }}-${{ inputs.runner }}
          fail-on-cache-miss: 'false'
          restore-keys: |
            global-llvm-${{ inputs.llvm_version }}-${{ inputs.runner }}
            global-llvm-${{ inputs.llvm_version }}

      - name: Verify installation
        run: |
          echo "=== Checking clang version ==="
          clang --version || echo "clang not found"
          echo "=== Checking clang-tidy version ==="
          clang-tidy --version || echo "clang-tidy not found"
          echo "=== Checking clang-format version ==="
          clang-format --version || echo "clang-format not found"
          echo "=== Cache status ==="
          echo "LLVM directory cache hit: ${{ steps.cache-llvm.outputs.cache-hit }}" || echo "No cache"
