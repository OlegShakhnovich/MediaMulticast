name: Format (reusable)

on:
  workflow_call:
    inputs:
      llvm_version:
        required: true
        type: string
            
permissions:
  contents: write
  
jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup LLVM ${{ inputs.llvm_version }}
        uses: ./.github/actions/setup-llvm
        with:
          runner: ubuntu-latest
          llvm_version: ${{ inputs.llvm_version }}
          is-fail-on-cache-miss: 'true'


      - name: Check formatting
        id: fmt
        run: |
          set -e
          rc=0
          files=$(find src include tests -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \) -print)
          for f in $files; do
            clang-format --dry-run --Werror -style=file "$f" || rc=1
          done
          echo "rc=$rc" >> $GITHUB_OUTPUT
    
