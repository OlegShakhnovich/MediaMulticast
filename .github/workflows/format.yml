name: Format (reusable)

on:
  workflow_call:
    inputs:
      llvm_version:
        required: true
        type: string
            
permissions:
  contents: write
  
jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup LLVM ${{ inputs.llvm_version }}
        uses: ./.github/actions/setup-llvm
        with:
          runner: ubuntu-latest
          llvm_version: ${{ inputs.llvm_version }}
          fail-on-cache-miss: 'true'


      - name: Check formatting
        id: fmt
        run: |
          set -e
          rc=0
          files=$(find src include tests -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \) -print)
          for f in $files; do
            clang-format --dry-run --Werror -style=file "$f" || rc=1
          done
          echo "rc=$rc" >> $GITHUB_OUTPUT
    
          
      - name: Apply format and push        
        if: steps.fmt.outputs.rc == '1'
        run: |
          # skip for forks
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            echo "Fork PR — skipping auto-push"
            exit 0
          fi
          files=$(find src include tests -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \) -print)
          for f in $files; do
            clang-format -i -style=file "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply clang-format ${{ inputs.llvm_version }}"
          git push
