name: Format (reusable)

on:
  workflow_call:
    inputs:
      llvm_version:
        required: true
        type: string
            
permissions:
  contents: write
  
jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup LLVM ${{ inputs.llvm_version }}
        uses: ./.github/actions/setup-llvm
        with:
          runner: ${{ inputs.runner }}
          llvm_version: ${{ inputs.llvm_version }}
          is_save-only: 'true'


      - name: Check formatting
        id: fmt
        run: |
          set -e
          rc=0
          CF="${{ inputs.llvm_path }}/clang-format"
          files=$(find src include tests -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \) -print)
          for f in $files; do
            "$CF" --dry-run --Werror -style=file "$f" || rc=1
          done
          echo "rc=$rc" >> $GITHUB_OUTPUT
    
          
