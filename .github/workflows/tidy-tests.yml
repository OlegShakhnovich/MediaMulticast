name: Tidy-tests (reusable)

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      llvm_version:
        required: true
        type: string

jobs:
  tidy-tests:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          runner: ${{ inputs.runner }}
          llvm_version: ${{ inputs.llvm_version }}

      - name: Generate compile_commands.json
        uses: ./.github/actions/generate-compile-commands
        with:
          build_dir: build_tidy_tests
          enable_tests: "ON"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compile_commands-tests-${{ inputs.runner }}
          path: build_tidy_tests/compile_commands.json

      - name: Run clang-tidy
        uses: ./.github/actions/run-clang-tidy
        with:
          build_dir: build_tidy_tests
          source_dirs: "tests"
          config_path: "tests/.clang-tidy"
          fail_on_error: "false"
          
