name: Run clang-tidy on directories
description: Executes clang-tidy recursively on selected directories

inputs:
  build_dir:
    required: true
    description: "Directory containing compile_commands.json"
  source_dirs:
    required: true
    description: "Space-separated list of directories to scan recursively for source files"
  config_path:
    required: true
    description: "Path to .clang-tidy config file"
  fail_on_error:
    required: false
    default: "true"
    description: "If true, exit with error when clang-tidy finds issues"

runs:
  using: composite
  steps:
    - name: Prepare dummy .cpp files for headers (macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -e
        dummy_dir="${{ inputs.build_dir }}/dummy_headers"
        mkdir -p "$dummy_dir"

        headers=(
          "src/udp_streaming_lib/logger/logger.hpp"
          "src/udp_streaming_lib/logger/logger_macros.hpp"
          "src/udp_streaming_lib/file_reader/file_reader.hpp"
          "src/udp_streaming_lib/queueing/queue.hpp"
          "src/udp_streaming_lib/networking/udp_multicast.hpp"
          "src/udp_streaming_lib/header_parser/header_parser.hpp"
          "src/udp_streaming_lib/timed_streaming/timer.hpp"
        )

        for h in "${headers[@]}"; do
          base=$(basename "$h" .hpp)
          dummy="$dummy_dir/${base}_dummy.cpp"
          echo "#include \"../../$h\"" > "$dummy"
        done

    - name: Run clang-tidy (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set +e
        any_error=false

        dirs=(${{ inputs.source_dirs }})
        files=$(find "${dirs[@]}" -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.h' -o -name '*.hpp' \))

        files+=($(find "${{ inputs.build_dir }}/dummy_headers" -type f -name '*.cpp'))

        for f in $files; do
          echo "Checking: $f"
          if clang-tidy -config-file="${{ inputs.config_path }}" -p "${{ inputs.build_dir }}" -header-filter='.*' "$f"; then
            echo "OK: $f"
          else
            echo "FAIL: $f"
            any_error=true
          fi
        done

        if [ "$any_error" = true ] && [ "${{ inputs.fail_on_error }}" = "true" ]; then
          exit 1
        fi

    - name: Run clang-tidy (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $anyError = $false

        $dirs = "${{ inputs.source_dirs }}".Split(" ")

        $files = foreach ($d in $dirs) {
          Get-ChildItem -Recurse $d -Include *.cpp,*.cc,*.h,*.hpp
        }

        foreach ($f in $files) {
          Write-Host "Checking: $($f.FullName)"
          & clang-tidy -config-file "${{ inputs.config_path }}" -p "${{ inputs.build_dir }}" $f.FullName
          if ($LASTEXITCODE -ne 0) {
            $anyError = $true
          }
        }

        if ($anyError -and "${{ inputs.fail_on_error }}" -eq "true") {
          exit 1
        fi
