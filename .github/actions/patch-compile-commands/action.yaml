name: Patch compile_commands.json for clang-tidy (macOS)
description: Normalize compile_commands.json across OS; patch macOS only

inputs:
  build_dir:
    required: true
    description: "Directory containing compile_commands.json"

runs:
  using: composite
  steps:
    - name: Patch compile_commands.json (in-place)
      shell: bash
      working-directory: ${{ inputs.build_dir }}
      run: |
        FILE="compile_commands.json"
        TMPFILE="$(mktemp)"

        sed -E \
          -e 's/-std=gnu\+\+20/-std=c++20/g' \
          -e 's@-isysroot[[:space:]]+\S+@@g' \
          -e 's@--sysroot=\S+@@g' \
          -e 's@-mmacosx-version-min=\S+@@g' \
          -e 's@-arch[[:space:]]+\S+@@g' \
          -e 's@-stdlib=\S+@@g' \
          -e 's@-Wl,-search_paths_first@@g' \
          -e 's@-Wl,-headerpad_max_install_names@@g' \
          "$FILE" > "$TMPFILE"

        awk '{$1=$1; print}' "$TMPFILE" > "$FILE"

        rm -f "$TMPFILE"

        echo "Patched compile_commands.json (macOS)"
