name: Patch compile_commands.json for clang-tidy (macOS)
description: Make compile_commands.json clean for clang-tidy using bash

inputs:
  build_dir:
    required: true
    description: "Directory containing compile_commands.json"

runs:
  using: composite
  steps:
    - name: Patch compile_commands.json (in-place)
      shell: bash
      working-directory: ${{ inputs.build_dir }}
      run: |
        SRC="compile_commands.json"
        TMP="${SRC}.tmp"

        # Remove system flags and leave only compiler, -std=c++20, and project -I paths
        jq '.[] | .command |= (
          split(" ") |
          map(select(
            test("^-I") and (test("src") or test("include"))
          ) or (. == (.[0]) ) or (. == "-std=gnu++20")
        ) | 
        map(if . == "-std=gnu++20" then "-std=c++20" else . end) |
        join(" ")
        )' "$SRC" > "$TMP"

        mv "$TMP" "$SRC"

        echo "Patched compile_commands.json (macOS): system includes removed, only project headers remain"
