name: Patch compile_commands.json for clang-tidy (macOS)
description: Ensure compile_commands.json is usable for clang-tidy on macOS

inputs:
  build_dir:
    required: true
    description: "Directory containing compile_commands.json"

runs:
  using: composite
  steps:
    - name: Patch compile_commands.json (in-place)
      shell: bash
      working-directory: ${{ inputs.build_dir }}
      run: |

        FILE="compile_commands.json"
        TMP_FILE="${FILE}.tmp"

        # Ensure paths are absolute or fix relative paths
        jq 'map(
          .command |= gsub("BUILD_DIR_PLACEHOLDER"; "'"${PWD}"'")
        )' "$FILE" > "$TMP_FILE" && mv "$TMP_FILE" "$FILE"

        echo "Patched compile_commands.json for macOS (paths fixed, flags preserved)"
