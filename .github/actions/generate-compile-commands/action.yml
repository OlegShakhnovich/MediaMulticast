name: Generate compile_commands.json
description: CMake configuration that generates compile_commands.json

inputs:
  build_dir:
    required: true
    description: "Directory where CMake will configure the build and place compile_commands.json"
  sysroot:
    required: false
    description: "Custom macOS SDK sysroot (optional); if omitted, detected via xcrun"
  compiler:
    required: false
    default: clang
    description: "C compiler to use with CMake"
  cxx_compiler:
    required: false
    default: clang++
    description: "C++ compiler to use with CMake"
  enable_tests:
    required: false
    default: 'OFF'
    description: "Enable building tests"

runs:
  using: composite
  steps:
    

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cmake -G Ninja -S . -B "${{ inputs.build_dir }}" \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_C_COMPILER="${{ inputs.compiler }}" \
          -DCMAKE_CXX_COMPILER="${{ inputs.cxx_compiler }}" \
          -DCMAKE_C_FLAGS="-fPIC -Wall -Wextra -pedantic" \
          -DCMAKE_CXX_FLAGS="-fPIC -Wall -Wextra -pedantic" \
          -DBUILD_TESTS="${{ inputs.enable_tests }}" \
          -DCMAKE_C_COMPILER=/Users/runner/work/MediaMulticast/MediaMulticast/llvm/bin/clang \
          -DCMAKE_CXX_COMPILER=/Users/runner/work/MediaMulticast/MediaMulticast/llvm/bin/clang++


    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cmake -G Ninja -S . -B "${{ inputs.build_dir }}" \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_C_COMPILER="${{ inputs.compiler }}" \
          -DCMAKE_CXX_COMPILER="${{ inputs.cxx_compiler }}" \
          -DBUILD_TESTS="${{ inputs.enable_tests }}"

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -G Ninja -S . -B "${{ inputs.build_dir }}" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
          -DCMAKE_CXX_STANDARD=20 `
          -DCMAKE_C_COMPILER="${{ inputs.compiler }}" `
          -DCMAKE_CXX_COMPILER="${{ inputs.cxx_compiler }}" `
          -DBUILD_TESTS="${{ inputs.enable_tests }}"


    - name: Check tools on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "Checking CMake version:"
        cmake --version
        echo "Checking Ninja version:"
        ninja --version
        echo "Checking compiler versions:"
        "${{ inputs.compiler }}" --version
        "${{ inputs.cxx_compiler }}" --version
        xcrun --sdk macosx --show-sdk-path
        xcrun --sdk macosx --show-sdk-version
        clang++ -v -E -dM -x c++ /dev/null | grep MAC_OS_X_VERSION
        cmake -LAH build_tidy | grep CMAKE_OSX