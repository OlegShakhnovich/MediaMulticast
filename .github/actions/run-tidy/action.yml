name: Run tidy
description: Unified clang-tidy execution step for Linux/macOS/Windows

inputs:
  build_dir:
    required: true
    description: 'Path to the build directory containing compile_commands.json'
  config_path:
    required: true
    description: 'Path to the clang-tidy configuration file'

runs:
  using: "composite"
  steps:

    - name: Verify compile_commands.json present
      shell: bash
      if: runner.os != 'Windows'
      run: |
        file="${{ inputs.build_dir }}/compile_commands.json"
        if [ ! -s "$file" ]; then
          echo "compile_commands.json missing or empty"
          exit 1
        fi

    - name: Verify compile_commands.json present (Windows)
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        $file = Join-Path "${{ inputs.build_dir }}" "compile_commands.json"
        if (-not (Test-Path $file)) {
          Write-Error "compile_commands.json missing"
          exit 1
        }

    - name: Extract translation units (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        jq -r '.[].file' "${{ inputs.build_dir }}/compile_commands.json" > tu_list.txt
        sort -o tu_list.txt tu_list.txt
        echo "Translation units:"
        cat tu_list.txt

    - name: Extract translation units (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $json = Join-Path "${{ inputs.build_dir }}" "compile_commands.json"
        (Get-Content $json | ConvertFrom-Json | ForEach-Object { $_.file }) |
          Sort-Object |
          Set-Content tu_list.txt
        Write-Host "Translation units:"
        Get-Content tu_list.txt

    - name: Run clang-tidy (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mapfile -t files < tu_list.txt
        clang-tidy \
          -config-file="${{ inputs.config_path }}" \
          -p "${{ inputs.build_dir }}" \
          "${files[@]}"
        exit $?

    - name: Run clang-tidy (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $config = "${{ inputs.config_path }}"
        $files = Get-Content tu_list.txt
        & clang-tidy `
          -config-file $config `
          -p "${{ inputs.build_dir }}" `
          --extra-arg-before=--driver-mode=cl `
          $files
        exit $LASTEXITCODE

